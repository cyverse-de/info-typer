# Properties whose values carry credentials, for asserting that /admin/config masks them.
#
# empty.properties is deliberately empty so that the config tests exercise the defaults, but
# that makes it useless for testing the mask: mask-config only reports properties that are
# actually set, so every assertion against it passes whether the mask works or not.
info-typer.irods.pass = notprod
info-typer.amqp.uri   = amqp://guest:SUPERSECRETBROKERPW@rabbit:5672/
